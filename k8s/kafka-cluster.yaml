
apiVersion: v1
kind: Service
metadata:
  name: sre-zookeeper
spec:
  selector:
    app: sre-zookeeper
  ports:
    - port: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-zookeeper-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-zookeeper
  template:
    metadata:
      labels:
        app: sre-zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.3.0
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"

---

apiVersion: v1
kind: Service
metadata:
  name: sre-kafka 
spec:
  selector:
    app: sre-kafka
  ports:
    - port: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-kafka-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-kafka
  template:
    metadata:
      labels:
        app: sre-kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.3.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "sre-zookeeper:2181" 
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://sre-kafka:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"