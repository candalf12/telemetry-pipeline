apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-redis-deployment
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: sre-redis 
  template:
    metadata:
      labels:
        app: sre-redis
    spec:
      containers:
      - name: redis
        image: redis:latest 
        ports:
        - containerPort: 6379 

---

apiVersion: v1
kind: Service
metadata:
  name: sre-redis 
spec:
  selector:
    app: sre-redis 
  ports:
    - protocol: TCP
      port: 6379       
      targetPort: 6379 