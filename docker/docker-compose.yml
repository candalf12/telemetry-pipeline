version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: sre-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  #kafka depends on zookeeper 
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: sre-kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  telemetry-agent:
    #to build it, redis and kafka
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: sre-c-agent
    depends_on:
      - kafka
    #not to crash
    restart: unless-stopped
  
  redis:
    image: redis:7.0-alpine
    container_name: sre-redis
    ports:
      - "127.0.0.1:6379:6379"

  #comsumer.
  telemetry-consumer:
    build:
      context: ../consumer
      dockerfile: Dockerfile
    container_name: sre-python-consumer
    depends_on:
      - kafka
      - redis
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sre-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=mehmetcanbastemm97@gmail.com
      - GF_SMTP_PASSWORD=hyni gmtw hqze nxuu
      - GF_SMTP_FROM_ADDRESS=mehmetcanbastemm97@gmail.com
      - GF_SMTP_FROM_NAME=SRE Telemetry Alarm
      - GF_INSTALL_PLUGINS=redis-datasource
    depends_on:
      - db
      - redis
    volumes:
      - grafana_data:/var/lib/grafana
  db:
    image: postgres:15-alpine
    container_name: sre-postgres
    environment:
      POSTGRES_USER: sre_user
      POSTGRES_PASSWORD: sre_password
      POSTGRES_DB: telemetry_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../database:/database
      - ../exports:/exports

volumes:
  postgres_data:
  grafana_data:
